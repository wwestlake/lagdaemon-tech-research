[server]
# Display name shown to connecting clients
name        = My Harmonia Server

# TCP port to listen on. 4440 = A440, the concert pitch standard.
# Forward this port (TCP) in your router for internet play.
port        = 4440

# Maximum simultaneous players across all sessions
max_players = 16

# World tick rate (Hz). 20 = 50ms per generation.
# Higher = smoother CA evolution, more CPU. 10-30 recommended.
tick_rate   = 20

[sessions]
# Sessions are created on demand when clients connect and specify a session name.
# Pre-declare a default session here so it always exists.
default_session = main

[ca]
# Default cellular automaton rule for the Living Grid
# Options: gameoflife3d, grayscott, lenia
default_rule = gameoflife3d

# Game of Life 3D defaults (neighbor counts in 3x3x3 neighborhood, max 26)
gol_survival_min = 4
gol_survival_max = 6
gol_birth_min    = 5
gol_birth_max    = 7
gol_mutation_rate = 0.02

# Gray-Scott defaults (Turing patterns)
gs_feed = 0.055
gs_kill = 0.062
gs_diff_u = 0.16
gs_diff_v = 0.08

[grid]
# Living Grid dimensions: X=pitch classes, Y=octaves, Z=beat slots
grid_width  = 24   # 2 octaves of chromatic pitch classes
grid_height = 7    # octaves 2-8
grid_depth  = 32   # 32 beat slots per bar loop

[logging]
# Log to file in addition to console
log_to_file = true
log_path    = logs/harmonia_server.log
# Options: DEBUG, INFO, WARN, ERROR
log_level   = INFO
